<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>weather-chart-card layout harness</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 14px; background: #ececec;
         --card-background-color: #fff; --primary-text-color: #212121;
         --secondary-text-color: #727272; --divider-color: #bdbdbd;
         --paper-item-icon-color: #44739e; }
  /* Home Assistant's own ha-card establishes a positioning context; without
     it the absolutely positioned clock escapes the card entirely. */
  ha-card { display: block; position: relative; background: var(--card-background-color);
            border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  ha-icon { color: var(--paper-item-icon-color); }
  .row { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .col h2 { font: 600 12px/1.6 system-ui; margin: 0 0 4px; color: #555; }
  #log { font: 12px/1.5 ui-monospace, monospace; background: #fff; border: 1px solid #ccc;
         padding: 6px; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<div id="log">(waiting)</div>

<script>
  // In Home Assistant <ha-icon> paints a 24px glyph. Undefined here it collapses
  // to nothing, which makes every spacing judgement wrong - so stub it.
  class HaIconStub extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = `<style>
        :host { display: inline-block; width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); vertical-align: middle; }
        svg { width: 100%; height: 100%; display: block; }
      </style><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>`;
    }
  }
  customElements.define('ha-icon', HaIconStub);
  // HA's own ha-card sets position: relative on :host, which is what keeps the
  // absolutely positioned clock inside the card. Page CSS cannot reach into the
  // card's shadow root, so the stub has to do it from the inside.
  class HaCardStub extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = `<style>:host { display: block; position: relative; }</style><slot></slot>`;
    }
  }
  customElements.define('ha-card', HaCardStub);
  window.__errors = [];
  addEventListener('error', (e) => window.__errors.push('error: ' + e.message));
  addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + e.reason));
</script>
<script src="../dist/weather-chart-card.js"></script>
<script>
// A card configured the way a real dashboard tends to configure it: override
// sensors for temperature and humidity, animated icons, compact forecast.
const CONFIG = {
  entity: 'weather.home',
  temp: 'sensor.outdoor_temperature',
  humid: 'sensor.outdoor_humidity',
  locale: 'pl',
  icons_size: 20,
  animated_icons: false,
  icon_style: 'style1',
  show_main: true,
  show_temperature: true,
  show_current_condition: true,
  show_attributes: true,
  show_humidity: true,
  show_pressure: true,
  show_wind_direction: true,
  show_wind_speed: true,
  show_wind_gust_speed: true,
  show_dew_point: true,
  show_visibility: true,
  show_sun: true,
  show_feels_like: true,
  forecast: {
    precipitation_type: 'rainfall',
    labels_font_size: '12',
    precip_bar_size: '80',
    style: 'style2',
    show_wind_forecast: true,
    condition_icons: true,
    round_temp: true,
    type: 'daily',
  },
  units: { pressure: '', speed: '' },
};

const NOW = new Date();
const FORECAST = [0, 1, 2, 3, 4, 5].map((i) => {
  const d = new Date(NOW);
  d.setHours(11, 0, 0, 0);
  d.setDate(d.getDate() + i);
  return {
    datetime: d.toISOString(),
    condition: ['partlycloudy', 'rainy', 'cloudy', 'partlycloudy', 'rainy', 'pouring'][i],
    temperature: [7, 9, 8, 6, 5, 4][i],
    templow: [6, 4, 3, 2, 1, 0][i],
    precipitation: [0, 1.2, 1.3, 0, 8, 12.5][i],
    precipitation_probability: [0, 40, 45, 10, 80, 95][i],
    wind_speed: [19, 26, 25, 21, 20, 14][i],
    wind_bearing: [209.5, 230, 250, 180, 160, 300][i],
  };
});

const HASS = {
  language: 'pl',
  selectedLanguage: 'pl',
  states: {
    'weather.home': {
      entity_id: 'weather.home',
      state: 'partlycloudy',
      last_changed: new Date(NOW.getTime() - 9 * 60000).toISOString(),
      attributes: {
        temperature: 6.6, humidity: 94, pressure: 1006.3,
        wind_speed: 18.7, wind_bearing: 209.5, wind_gust_speed: 34.2,
        dew_point: 5.7, uv_index: 0, visibility: 12.4, apparent_temperature: 4.1,
        temperature_unit: '°C', pressure_unit: 'hPa', wind_speed_unit: 'km/h',
        visibility_unit: 'km', precipitation_unit: 'mm', supported_features: 3,
      },
    },
    'sensor.outdoor_temperature': { state: '8.7', attributes: {} },
    'sensor.outdoor_humidity': { state: '92.4', attributes: {} },
    'sun.sun': {
      state: 'below_horizon',
      attributes: {
        next_rising: new Date(NOW.getTime() + 13 * 3600e3).toISOString(),
        next_setting: new Date(NOW.getTime() + 22 * 3600e3).toISOString(),
      },
    },
  },
  config: { unit_system: { temperature: '°C', length: 'km' } },
  connection: {
    subscribeMessage(cb) {
      setTimeout(() => cb({ forecast: FORECAST }), 0);
      return Promise.resolve(() => {});
    },
  },
  callWS: () => Promise.resolve({}),
};

// The widths that matter: a phone column, a half-width dashboard card, a
// tablet column and a full-width desktop card.
const WIDTHS = [360, 500, 760, 1040];
const row = document.getElementById('row');
WIDTHS.forEach((w) => {
  const col = document.createElement('div');
  col.className = 'col';
  col.style.width = w + 'px';
  col.innerHTML = `<h2>${w} px</h2>`;
  row.appendChild(col);
  const el = document.createElement('weather-chart-card');
  el.setConfig(JSON.parse(JSON.stringify(CONFIG)));
  col.appendChild(el);
  el.hass = HASS;
});

// Variants that stress the header: the absolutely positioned clock, and a
// card with almost nothing switched on.
const VARIANTS = [
  ['z zegarem (show_time)', { ...CONFIG, show_time: true, show_day: true, show_date: true }],
  ['minimalny zestaw', {
    ...CONFIG,
    show_dew_point: false, show_visibility: false, show_sun: false,
    show_wind_gust_speed: false, show_feels_like: false, show_pressure: false,
  }],
];
VARIANTS.forEach(([label, cfg]) => {
  const col = document.createElement('div');
  col.className = 'col';
  col.style.width = '500px';
  col.innerHTML = `<h2>500 px - ${label}</h2>`;
  row.appendChild(col);
  const el = document.createElement('weather-chart-card');
  el.setConfig(JSON.parse(JSON.stringify(cfg)));
  col.appendChild(el);
  el.hass = HASS;
});

setTimeout(() => {
  document.getElementById('log').textContent = window.__errors.length
    ? 'ERRORS:\n' + window.__errors.join('\n')
    : 'OK: no uncaught errors';
}, 1200);
</script>
</body>
</html>
