<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>weather-chart-card — ciemny motyw i szkło</title>
<style>
  /* Approximates the house dashboard: dark theme, a photo behind the cards.
     The "photo" is a stack of gradients - what matters for judging the glass
     is that something with contrast sits behind the card, not what it shows. */
  body {
    font-family: system-ui, sans-serif; margin: 0; padding: 16px; min-height: 100vh;
    background:
      radial-gradient(60% 50% at 18% 22%, #2d6ea8 0%, rgba(45,110,168,0) 60%),
      radial-gradient(45% 40% at 78% 18%, #9a6b3f 0%, rgba(154,107,63,0) 62%),
      radial-gradient(70% 60% at 62% 85%, #1f5c52 0%, rgba(31,92,82,0) 65%),
      linear-gradient(160deg, #10141a 0%, #1b2029 55%, #0c0f14 100%);
    --card-background-color: #1c2026;
    --ha-card-background: #1c2026;
    --primary-text-color: #e8eaed;
    --secondary-text-color: #9aa0a6;
    --divider-color: #3c4149;
    --paper-item-icon-color: #8ab4f8;
  }
  ha-card { display: block; position: relative; background: var(--ha-card-background);
            border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.45); padding: 0; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .col h2 { font: 600 12px/1.6 system-ui; margin: 0 0 6px; color: #cfd3d8; }
  #log { font: 12px/1.5 ui-monospace, monospace; background: rgba(0,0,0,.55); color: #e8eaed;
         border: 1px solid #3c4149; padding: 8px; margin-top: 14px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<div id="log">(czekam)</div>

<script>
  class HaIconStub extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = `<style>
        :host { display:inline-block; width:var(--mdc-icon-size,24px); height:var(--mdc-icon-size,24px); vertical-align:middle; }
        svg { width:100%; height:100%; display:block; }
      </style><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>`;
    }
  }
  customElements.define('ha-icon', HaIconStub);
  class HaCardStub extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = `<style>:host { display:block; position:relative; }</style><slot></slot>`;
    }
  }
  customElements.define('ha-card', HaCardStub);
  window.__errors = [];
  addEventListener('error', (e) => window.__errors.push('error: ' + e.message));
  addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + e.reason));
</script>
<script src="../dist/weather-chart-card.js"></script>
<script>
// The production card config, with wind off and the chart row kept.
const BASE = {
  entity: 'weather.home',
  temp: 'sensor.outdoor_temperature',
  humid: 'sensor.outdoor_humidity',
  locale: 'pl',
  icons_size: 20,
  animated_icons: false,
  show_main: true,
  show_temperature: true,
  show_current_condition: true,
  show_attributes: true,
  show_humidity: true,
  show_pressure: true,
  show_wind_direction: false,
  show_wind_speed: false,
  show_sun: false,
  show_feels_like: false,
  forecast: {
    precipitation_type: 'rainfall',
    labels_font_size: '12',
    precip_bar_size: '80',
    style: 'style2',
    show_wind_forecast: true,
    condition_icons: true,
    round_temp: true,
    type: 'daily',
  },
  units: { pressure: '', speed: '' },
};

const NOW = new Date();
const FORECAST = [0,1,2,3,4,5].map((i) => {
  const d = new Date(NOW); d.setHours(11,0,0,0); d.setDate(d.getDate() + i);
  return {
    datetime: d.toISOString(),
    condition: ['partlycloudy','rainy','cloudy','partlycloudy','rainy','pouring'][i],
    temperature: [7, 9, 12, 16, 21, 26][i],
    templow: [2, 4, 6, 9, 13, 17][i],
    precipitation: [0, 1.2, 1.3, 0, 8, 12.5][i],
    precipitation_probability: [0, 40, 45, 10, 80, 95][i],
    wind_speed: [19, 26, 25, 21, 20, 14][i],
    wind_bearing: [209.5, 230, 250, 180, 160, 300][i],
  };
});

const HASS = {
  language: 'pl', selectedLanguage: 'pl',
  states: {
    'weather.home': {
      entity_id: 'weather.home', state: 'partlycloudy',
      last_changed: new Date(NOW.getTime() - 9*60000).toISOString(),
      attributes: {
        temperature: 6.6, humidity: 94, pressure: 1006.3, wind_speed: 18.7,
        wind_bearing: 209.5, wind_gust_speed: 34.2, dew_point: 5.7, uv_index: 0,
        visibility: 12.4, apparent_temperature: 4.1, temperature_unit: '°C',
        pressure_unit: 'hPa', wind_speed_unit: 'km/h', visibility_unit: 'km',
        precipitation_unit: 'mm', supported_features: 3,
      },
    },
    'sensor.outdoor_temperature': { state: '8.5', attributes: {} },
    'sensor.outdoor_humidity': { state: '90.4', attributes: {} },
    'sun.sun': { state: 'below_horizon', attributes: {
      next_rising: new Date(NOW.getTime() + 13*3600e3).toISOString(),
      next_setting: new Date(NOW.getTime() + 22*3600e3).toISOString() } },
  },
  config: { unit_system: { temperature: '°C', length: 'km' } },
  connection: { subscribeMessage(cb) { setTimeout(() => cb({ forecast: FORECAST }), 0); return Promise.resolve(() => {}); } },
  callWS: () => Promise.resolve({}),
};

const VARIANTS = [
  ['500 px — bez szkła', 500, {}],
  ['500 px — szkło', 500, { glass: true }],
  ['360 px — szkło (telefon)', 360, { glass: true }],
  ['760 px — szkło', 760, { glass: true }],
];

const row = document.getElementById('row');
const cards = [];
VARIANTS.forEach(([label, width, extra]) => {
  const col = document.createElement('div');
  col.className = 'col';
  col.style.width = width + 'px';
  col.innerHTML = `<h2>${label}</h2>`;
  row.appendChild(col);
  const el = document.createElement('weather-chart-card');
  el.setConfig(JSON.parse(JSON.stringify({ ...BASE, ...extra })));
  col.appendChild(el);
  el.hass = HASS;
  cards.push([label, el]);
});

setTimeout(() => {
  const out = [];
  if (window.__errors.length) out.push('BŁĘDY: ' + window.__errors.join('; '));
  cards.forEach(([label, el]) => {
    const sr = el.shadowRoot;
    const card = sr.querySelector('ha-card');
    const main = sr.querySelector('.main');
    const attrs = [...sr.querySelectorAll('.attribute')].map((a) => a.textContent.trim().replace(/\s+/g, ' '));
    const cond = sr.querySelector('.current-condition');
    const temp = sr.querySelector('.temperature');
    const canvas = sr.querySelector('#forecastChart');
    const r = (e) => e ? e.getBoundingClientRect() : null;
    const cr = r(card), tr = r(temp), mr = r(main);
    out.push(`${label}: karta ${Math.round(cr.height)}px | warunki "${cond ? cond.textContent.trim() : '-'}" ${cond ? getComputedStyle(cond).fontSize : ''} | temp ${temp ? temp.textContent.trim() : '-'} ${temp ? getComputedStyle(temp).fontSize : ''} | atrybuty [${attrs.join(' | ')}] ${attrs.length ? getComputedStyle(sr.querySelector('.attr-value')).fontSize : ''} | kanwa ${canvas ? Math.round(r(canvas).width) : 0}px`);
    if (tr && cr && tr.right > cr.right - 4) out.push(`  ⚠ ${label}: temperatura wychodzi poza kartę`);
    if (mr && cr && mr.width > cr.width) out.push(`  ⚠ ${label}: główny wiersz szerszy niż karta`);
  });
  document.getElementById('log').textContent = out.join('\n');
  window.__report = out;
}, 1500);
</script>
</body>
</html>
