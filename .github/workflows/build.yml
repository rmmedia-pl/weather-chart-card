name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check dist/ matches the source
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard dist/)
          if [ -n "$untracked" ]; then
            echo "::error::Untracked files in dist/: $untracked"
            exit 1
          fi
